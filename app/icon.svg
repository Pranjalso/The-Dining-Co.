<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient: Deep Luxury Obsidian & Warm Espresso -->
    <linearGradient id="kingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231E1B"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </linearGradient>

    <!-- Metallic Gold Crown Gradient -->
    <linearGradient id="kingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A0"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gold Accent / Border Gradient -->
    <linearGradient id="kingBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Subtle Crown Shimmer Highlight -->
    <linearGradient id="kingShimmer" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FDE68A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Luxury Squircle Canvas -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#kingBg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="none" stroke="url(#kingBorder)" stroke-width="1.2"/>

  <!-- Royal King Cross / Emblem at Crown Apex -->
  <!-- Cross vertical bar -->
  <rect x="15" y="4.5" width="2" height="5" rx="0.5" fill="url(#kingGold)"/>
  <!-- Cross horizontal bar -->
  <rect x="13.5" y="6" width="5" height="1.8" rx="0.4" fill="url(#kingGold)"/>
  <circle cx="16" cy="6.9" r="0.8" fill="#FFFFFF"/>

  <!-- King Crown Body (5 Bold Royal Peaks) -->
  <path d="M 5.5 13 
           L 9.5 17 
           L 13 11 
           L 16 14.5 
           L 19 11 
           L 22.5 17 
           L 26.5 13 
           L 24.5 22.5 
           C 20 23.8 12 23.8 7.5 22.5 
           Z" 
        fill="url(#kingGold)" 
        stroke="#78350F" 
        stroke-width="0.6" 
        stroke-linejoin="round"/>

  <!-- Crown Base Arch Band -->
  <path d="M 6.8 24 
           C 11.5 25.5 20.5 25.5 25.2 24 
           L 25.5 26.2 
           C 20.5 27.7 11.5 27.7 6.5 26.2 
           Z" 
        fill="url(#kingGold)" 
        stroke="#78350F" 
        stroke-width="0.5"/>

  <!-- Central Crest Diamond Facet -->
  <polygon points="16,15 18,19 16,22.5 14,19" fill="url(#kingShimmer)"/>

  <!-- Royal Peak Jewels (Orbs on each crown tip) -->
  <circle cx="5.5" cy="12.5" r="1.3" fill="url(#kingGold)"/>
  <circle cx="5.5" cy="12.2" r="0.5" fill="#FFFFFF"/>

  <circle cx="13" cy="10.5" r="1.4" fill="url(#kingGold)"/>
  <circle cx="13" cy="10.2" r="0.5" fill="#FFFFFF"/>

  <circle cx="19" cy="10.5" r="1.4" fill="url(#kingGold)"/>
  <circle cx="19" cy="10.2" r="0.5" fill="#FFFFFF"/>

  <circle cx="26.5" cy="12.5" r="1.3" fill="url(#kingGold)"/>
  <circle cx="26.5" cy="12.2" r="0.5" fill="#FFFFFF"/>

  <!-- Base Band Regal Gemstones -->
  <circle cx="10" cy="25.2" r="0.8" fill="#FFFFFF"/>
  <circle cx="16" cy="25.9" r="1" fill="#FFFFFF"/>
  <circle cx="22" cy="25.2" r="0.8" fill="#FFFFFF"/>
</svg>
