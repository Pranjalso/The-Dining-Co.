<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Rich 24K Royal Gold Gradient -->
    <linearGradient id="tdcKingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Deep Bronze Contour Stroke for Ultra High Contrast on White & Dark Tabs -->
    <linearGradient id="tdcKingStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#582906"/>
    </linearGradient>

    <!-- Pearl Highlight Glow -->
    <linearGradient id="tdcPearlShine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for crisp elevation -->
    <filter id="tdcKingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#451A03" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tdcKingShadow)">
    <!-- Base Royal Arch Ribbon -->
    <rect x="6.5" y="38" width="35" height="4.8" rx="2.4" fill="url(#tdcKingGold)" stroke="url(#tdcKingStroke)" stroke-width="0.8"/>
    
    <!-- King Crown Body (5 Majestic Royal Prongs) -->
    <path d="M 8.5 36 
             L 5.5 19 
             L 14.5 28 
             L 24 10.5 
             L 33.5 28 
             L 42.5 19 
             L 39.5 36 
             Z" 
          fill="url(#tdcKingGold)" 
          stroke="url(#tdcKingStroke)" 
          stroke-width="0.8" 
          stroke-linejoin="round"/>

    <!-- Center Facet Light Highlight -->
    <polygon points="24,14 27.5,23.5 24,31 20.5,23.5" fill="url(#tdcPearlShine)"/>

    <!-- Pearl Orbs on Each Crown Tip -->
    <!-- Left outer peak -->
    <circle cx="5.5" cy="18" r="3.2" fill="url(#tdcKingGold)" stroke="url(#tdcKingStroke)" stroke-width="0.6"/>
    <circle cx="5.5" cy="17" r="1.1" fill="#FFFFFF"/>

    <!-- Left inner peak -->
    <circle cx="14.5" cy="27" r="2.8" fill="url(#tdcKingGold)" stroke="url(#tdcKingStroke)" stroke-width="0.6"/>
    <circle cx="14.5" cy="26.2" r="0.9" fill="#FFFFFF"/>

    <!-- Center King Master Peak -->
    <circle cx="24" cy="9.5" r="3.8" fill="url(#tdcKingGold)" stroke="url(#tdcKingStroke)" stroke-width="0.6"/>
    <circle cx="24" cy="8.4" r="1.3" fill="#FFFFFF"/>

    <!-- Right inner peak -->
    <circle cx="33.5" cy="27" r="2.8" fill="url(#tdcKingGold)" stroke="url(#tdcKingStroke)" stroke-width="0.6"/>
    <circle cx="33.5" cy="26.2" r="0.9" fill="#FFFFFF"/>

    <!-- Right outer peak -->
    <circle cx="42.5" cy="18" r="3.2" fill="url(#tdcKingGold)" stroke="url(#tdcKingStroke)" stroke-width="0.6"/>
    <circle cx="42.5" cy="17" r="1.1" fill="#FFFFFF"/>
  </g>
</svg>
