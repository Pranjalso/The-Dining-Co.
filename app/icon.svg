<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Obsidian & Espresso -->
    <linearGradient id="tdcBgApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="50%" stop-color="#171412"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </linearGradient>

    <!-- Metallic Gold Foil Border -->
    <linearGradient id="tdcGoldBorderApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA2"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7A5606"/>
    </linearGradient>

    <!-- Royal Crown Gold Gradient -->
    <linearGradient id="tdcCrownApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#ECC648"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8C6405"/>
    </linearGradient>

    <!-- Highlight Reflection -->
    <linearGradient id="tdcHighlightApp" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FCEBA2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Center Warmth -->
    <radialGradient id="tdcGlowApp" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tdcBgApp)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tdcGlowApp)"/>
  
  <!-- Outer Gold Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="url(#tdcGoldBorderApp)" stroke-width="1.8"/>

  <!-- Inner Hairline Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="0.8"/>

  <!-- Royal Crown Structure -->
  <!-- Base Arch Ribbon -->
  <path d="M15 44 C 23 46.5, 41 46.5, 49 44 L 47.5 40 C 40 42.2, 24 42.2, 16.5 40 Z" fill="url(#tdcCrownApp)"/>
  
  <!-- Base band gems -->
  <circle cx="21" cy="42" r="1.2" fill="#FFFFFF"/>
  <circle cx="32" cy="43.2" r="1.5" fill="#FFFFFF"/>
  <circle cx="43" cy="42" r="1.2" fill="#FFFFFF"/>

  <!-- Crown Body -->
  <path d="M16 39.5 L 13.5 25.5 L 24 33 L 32 17.5 L 40 33 L 50.5 25.5 L 48 39.5 C 40 41.8, 24 41.8, 16 39.5 Z" fill="url(#tdcCrownApp)"/>

  <!-- Crown Highlight Facets -->
  <path d="M32 17.5 L 36.5 29 L 32 37.5 L 27.5 29 Z" fill="url(#tdcHighlightApp)"/>
  <path d="M24 33 L 27.5 29 L 26 38 Z" fill="#7A5606" opacity="0.45"/>
  <path d="M40 33 L 36.5 29 L 38 38 Z" fill="#7A5606" opacity="0.45"/>

  <!-- Crown Peak Jewels -->
  <circle cx="13.5" cy="25" r="2.6" fill="url(#tdcGoldBorderApp)"/>
  <circle cx="13.5" cy="24.4" r="1.2" fill="#FFFFFF"/>

  <circle cx="24" cy="32" r="2.2" fill="url(#tdcGoldBorderApp)"/>
  <circle cx="24" cy="31.4" r="1" fill="#FFFFFF"/>

  <circle cx="32" cy="16.5" r="3.2" fill="url(#tdcGoldBorderApp)"/>
  <circle cx="32" cy="15.6" r="1.5" fill="#FFFFFF"/>

  <circle cx="40" cy="32" r="2.2" fill="url(#tdcGoldBorderApp)"/>
  <circle cx="40" cy="31.4" r="1" fill="#FFFFFF"/>

  <circle cx="50.5" cy="25" r="2.6" fill="url(#tdcGoldBorderApp)"/>
  <circle cx="50.5" cy="24.4" r="1.2" fill="#FFFFFF"/>
</svg>
